<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#79a9d2"><title>VERITY Edition</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <div id="menu" class="screen">
    <div class="menu-panel"><div class="logo">MINECRAFT<span>VERITY EDITION</span></div>
      <button id="new-world">Одиночная игра</button><button id="continue-world">Продолжить мир</button><button id="settings-button">Настройки</button>
      <div id="settings" class="settings hidden"><label>Чувствительность <input id="sensitivity" type="range" min="0.5" max="3" step="0.1" value="1.2"></label><label>Дальность прорисовки <input id="render-distance" type="range" min="2" max="5" step="1" value="3"></label></div>
      <p class="version">VERITY EDITION • browser build</p></div>
  </div>
  <div id="game" class="hidden"><div id="crosshair">+</div><div id="target-name"></div><div id="break-progress"><div></div></div>
    <div id="hud"><div id="status"><div id="hearts">♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥</div><div id="hunger">● ● ● ● ● ● ● ● ● ●</div></div><div id="hotbar"></div></div>
    <div id="held-item"></div><div id="hello-layer"></div>
    <div id="inventory" class="panel hidden"><h2>Инвентарь</h2><div id="inventory-grid"></div><p>Перетащи предметы между слотами. E или Esc - закрыть.</p></div>
    <div id="pause" class="panel hidden"><h2>Игра приостановлена</h2><button id="resume">Вернуться в игру</button><button id="save-exit">Сохранить и выйти в меню</button></div>
    <div id="mobile-controls"><div id="joystick"><div></div></div><div class="mobile-actions"><button data-action="jump">↑</button><button data-action="mine">⛏</button><button data-action="place">▣</button></div></div>
    <div id="hint">WASD движение · Space прыжок · Shift присесть · ЛКМ добыча / удар · ПКМ поставить · E инвентарь · Esc пауза</div>
  </div>
  <script type="module" src="js/main.js"></script>
</body></html>
